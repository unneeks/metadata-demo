version: '3.8'

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.7.3}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/src:/opt/airflow/src
    - ${AIRFLOW_PROJ_DIR:-.}/bronze:/opt/airflow/bronze
    - ${AIRFLOW_PROJ_DIR:-.}/silver:/opt/airflow/silver
    - ${AIRFLOW_PROJ_DIR:-.}/gold:/opt/airflow/gold
    - ${AIRFLOW_PROJ_DIR:-.}/metadata:/opt/airflow/metadata
    - ${AIRFLOW_PROJ_DIR:-.}/spark:/opt/airflow/spark
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  minio:
    image: quay.io/minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mc:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password;
      /usr/bin/mc mb myminio/lakehouse;
      exit 0;
      "

  rest:
    image: tabulario/iceberg-rest
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
    ports:
      - 8181:8181
    depends_on:
      - minio

  spark-iceberg:
    image: tabulario/spark-iceberg
    environment:
      - SPARK_HOME=/opt/spark
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/spark:/opt/spark/work-dir
      - ${AIRFLOW_PROJ_DIR:-.}/bronze:/opt/spark/bronze
      - ${AIRFLOW_PROJ_DIR:-.}/silver:/opt/spark/silver
      - ${AIRFLOW_PROJ_DIR:-.}/gold:/opt/spark/gold
    ports:
      - "8888:8888"
      - "8081:8080"

  trino:
    image: trinodb/trino:435
    ports:
      - "8082:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  neo4j:
    image: neo4j:5.12.0
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ${AIRFLOW_PROJ_DIR:-.}/neo4j/nodes:/var/lib/neo4j/import/nodes
      - ${AIRFLOW_PROJ_DIR:-.}/neo4j/relationships:/var/lib/neo4j/import/relationships

  mysql:
    image: openmetadata/db:1.4.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  opensearch:
    image: opensearchproject/opensearch:2.7.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=adminAdmin123!
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  openmetadata-server:
    image: openmetadata/server:1.4.0
    environment:
      - DB_DRIVER_CLASS=com.mysql.cj.jdbc.Driver
      - DB_SCHEME=mysql
      - DB_USE_SSL=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=openmetadata_user
      - DB_PASSWORD=openmetadata_password
      - DB_NAME=openmetadata_db
      - ELASTICSEARCH_HOST=opensearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_SCHEME=http
      - ELASTICSEARCH_KEEP_ALIVE_TIMEOUT_SECS=600
    ports:
      - "8585:8585"
    depends_on:
      - mysql
      - opensearch

  openmetadata-ingestion:
    image: openmetadata/ingestion:1.4.0
    environment:
      - OM_SERVER_URL=http://openmetadata-server:8585/api
    depends_on:
      - openmetadata-server
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/openmetadata:/openmetadata
      - ${AIRFLOW_PROJ_DIR:-.}/scripts:/scripts

volumes:
  minio_data:
  neo4j_data:
  mysql_data:
  opensearch_data:
